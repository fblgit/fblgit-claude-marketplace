# pip install pre-commit && pre-commit install   (installs the commit and the push hooks)
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1          # same version CI runs
    hooks:
      - id: gitleaks
        stages: [pre-push]          # secrets are checked on push: the whole history; the config is inline, as in ci.yml
        entry: |-
          bash -c 'GITLEAKS_CONFIG_TOML="[extend]
          useDefault = true
          [allowlist]
          regexTarget = \"line\"
          regexes = [\"triage[.]keys-table\"]" gitleaks git --redact --verbose'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check     # rules: ruff.toml
  - repo: local
    hooks:
      - id: plugin-tests
        name: build the tools from the skills and run every vector
        entry: python3 -m unittest discover -s tests
        language: system
        pass_filenames: false
        stages: [pre-push]          # about 50 s: on push, not on every commit
        files: ^(plugins/artifact-data-protocol/|tools/|tests/)
